name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-26.04
            platform: linux-x64
            native: true
          - os: windows-2025
            platform: windows-x64
            native: true
          - os: macos-26
            platform: macos-aarch64
            native: true
          - os: macos-26-intel
            platform: macos-x64
            native: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Setup Temurin
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup GraalVM
        if: matrix.native
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          version: '25.5'
          java-version: '25'
          set-java-home: 'false'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image on Windows
        if: runner.os == 'Windows' && matrix.native
        run: .\mvnw.cmd -B -Pnative package

      - name: Build native image on macOS / Linux
        if: runner.os != 'Windows' && matrix.native
        run: ./mvnw -B -Pnative package

      - name: Build without native image
        if: ${{ !matrix.native }}
        run: ./mvnw -B package

      - name: Pack binary on Windows
        if: runner.os == 'Windows' && matrix.native
        working-directory: amberfic-cli-dist/target
        run: |
          7z a ../../amberfic-${{ matrix.platform }}.zip amberfic.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          7z l ../../amberfic-${{ matrix.platform }}.zip

      - name: Pack binary on macOS / Linux
        if: runner.os != 'Windows' && matrix.native
        run: tar -czf amberfic-${{ matrix.platform }}.tar.gz -C amberfic-cli-dist/target amberfic

      - name: Upload binary
        if: matrix.native
        uses: actions/upload-artifact@v7
        with:
          path: amberfic-${{ matrix.platform }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
          archive: 'false'
          if-no-files-found: error

      - name: Upload Jar
        if: matrix.platform == 'linux-x64'
        uses: actions/upload-artifact@v7
        with:
          path: amberfic-cli-dist/target/amberfic.jar
          archive: 'false'
          if-no-files-found: error

      - name: Rename JLink zip
        shell: bash
        run: mv amberfic-cli-dist/target/amberfic-cli-dist-*.zip amberfic-jlink-${{ matrix.platform }}.zip

      - name: Upload JLink
        uses: actions/upload-artifact@v7
        with:
          path: amberfic-jlink-${{ matrix.platform }}.zip
          archive: 'false'
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
          skip-decompress: true

      - name: List downloaded files
        run: ls -lR dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes
