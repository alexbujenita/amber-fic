name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  native-linux:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          distribution: graalvm-community
          version: '25.5'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native image
        run: ./mvnw -B -Pnative package

      - name: Pack binary
        run: tar -czf amberfic-linux-x64.tar.gz -C amberfic-cli-dist/target amberfic

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          path: amberfic-linux-x64.tar.gz
          archive: 'false'

      - name: Upload Jar
        uses: actions/upload-artifact@v7
        with:
          path: amberfic-cli-dist/target/amberfic.jar
          archive: 'false'

      - name: Upload JLink
        uses: actions/upload-artifact@v7
        with:
          path: amberfic-cli-dist/target/amberfic-cli-dist-*.zip
          archive: 'false'

  release:
    needs: native-linux
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded files
        run: ls -lR dist

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes

